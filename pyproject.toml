[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algoxpert-sports-quant-lab"
version = "1.0.0"
description = "Leakage-aware, reproducible MLS probability research and verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack (Pham The Anh), AlgoXpert" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "streamlit>=1.37",
  "plotly>=5.20",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

[project.scripts]
sports-quant = "sports_quant_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

